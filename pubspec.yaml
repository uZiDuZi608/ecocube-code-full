name: flutter_application_1
description: EchoCube Local TTS, STT and Mobile LLM
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ==========================================================
  # FLUTTER ICONS
  # ==========================================================

  cupertino_icons: ^1.0.8

  # ==========================================================
  # LOCAL / OFFLINE SHERPA-ONNX
  # ==========================================================

  sherpa_onnx: ^1.13.5

  # ==========================================================
  # PLAY GENERATED TTS WAV AUDIO
  # ==========================================================

  audioplayers: ^6.5.0

  # ==========================================================
  # MICROPHONE / PCM AUDIO FOR STT
  # ==========================================================

  record: ^6.1.2

  # ==========================================================
  # NETWORK / mDNS DEVICE DISCOVERY
  # ==========================================================

  nsd: ^4.0.0

  # ==========================================================
  # LOCAL / OFFLINE LLM
  # ==========================================================

  llamadart: 0.8.19

  path_provider: ^2.1.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:

    # ========================================================
    # LOCAL TTS - PIPER KATHLEEN LOW
    # ========================================================

    - assets/models/tts/vits-piper-en_US-kathleen-low/
    - assets/models/tts/vits-piper-en_US-kathleen-low/espeak-ng-data/

    # ========================================================
    # LOCAL STT - NEMO CONFORMER MEDIUM CTC
    # ========================================================

    - assets/models/stt/sherpa-onnx-nemo-ctc-en-conformer-medium/

    # ========================================================
    # LOCAL LLM - LLAMA 3.2 1B INSTRUCT GGUF
    # ========================================================

    - assets/models/llm/llama/

